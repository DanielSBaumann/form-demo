<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Demo - Submit & View Data</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Form Demo</h1>
      <p class="subtitle">Test the full-stack pipeline: submit → persist → retrieve</p>
    </header>

    <main>
      <!-- Form Section -->
      <section class="form-section">
        <h2>Submit a Message</h2>
        <form id="submitForm">
          <div class="form-group">
            <label for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your name"
              required
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your@email.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="message">Message:</label>
            <textarea
              id="message"
              name="message"
              placeholder="Write your message here..."
              rows="4"
              required
            ></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Submit</button>
          <span id="submitStatus" class="status"></span>
        </form>
      </section>

      <!-- Submissions List Section -->
      <section class="list-section">
        <h2>Recent Submissions</h2>
        <div id="loadingStatus" class="status loading">Loading...</div>
        <div id="submissionsList" class="submissions-list"></div>
      </section>
    </main>

    <footer>
      <p>API Endpoint: <code id="apiEndpoint">http://localhost:3000/api</code></p>
      <p>Last updated: <span id="lastUpdated">never</span></p>
    </footer>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
